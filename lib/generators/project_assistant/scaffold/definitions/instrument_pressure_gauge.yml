measurement_type:
  type: enum_translated
  keys: [positive_pressure, vacuum, absolute, differential]
  required: true
pressure_unit:
  type: enum_translated
  keys: [bar, psi, kpa, kgf_cm2, in_hg, other]
  valid: bar
range_min:
  type: float
  precision: 6
  step: 0.01
  required: true
  valid: 0
range_max:
  type: float
  precision: 6
  step: 0.01
  required: true
  valid: 10
fluid_phase:
  type: enum_translated
  keys: [gas, liquid, other]
  valid: gas
process_fluid:
  type: enum_translated
  keys: [air, water, oil, steam, other]
  valid: gas
accuracy_class:
  type: enum_translated
  keys: [grade_1_0, grade_1_6, grade_2_5, other]
  valid: grade_1_6
dial_size:
  type: enum_translated
  keys: [mm63, mm100, mm150, other]
  valid: mm100
connection_type:
  type: enum_translated
  keys: [npt, bsp, flanged, other]
  valid: npt
connection_size:
  type: enum_translated
  keys: [in_1_4, in_1_2, in_3_4, other]
  valid: in_1_2
case_material:
  type: enum_translated
  keys: [stainless_steel, carbon_steel, aluminium, phenolic, other]
  valid: stainless_steel
wetted_material:
  type: enum_translated
  keys: [ss316, brass, monel, other]
  valid: ss316
movement_type:
  type: enum_translated
  keys: [bourdon_tube, diaphragm, bellows, other]
  valid: bourdon_tube
liquid_filled:
  type: boolean
  valid: true
fill_fluid:
  type: enum_translated
  keys: [none, glycerine, silicone, other]
  valid: glycerine
ingress_protection:
  type: ip
  valid: 65
safety_pattern:
  type: boolean
  valid: false
accessories:
  type: jsonb
  valid: "Snubber: Required"
notes:
  type: text
