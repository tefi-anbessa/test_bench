# Common settings for all environments
default: &default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

# Development and test environments use SQLite
development:
  <<: *default
  adapter: sqlite3
  database: db/development.sqlite3

test:
  <<: *default
  adapter: sqlite3
  database: db/test.sqlite3

# Production environment uses PostgreSQL
production:
  <<: *default
  adapter: postgresql
  encoding: unicode
  database: <%= ENV['DATABASE_NAME'] || 'test_bench_production' %>
  username: <%= ENV['DATABASE_USERNAME'] || 'postgres' %>
  password: <%= ENV['DATABASE_PASSWORD'] %>
  host: <%= ENV['DATABASE_HOST'] || 'localhost' %>
  port: <%= ENV['DATABASE_PORT'] || 5432 %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # For optimal performance, consider adjusting these values based on your server's resources
  variables:
    statement_timeout: 5000
  # For connection pooling with PgBouncer in transaction mode
  prepared_statements: false
