# Standard engineering disciplines available in the system
# These will be available to all projects
#
# Fields:
#   code:       Symbol identifier (used internally)
#   label:      Short 2-3 character code (for display)
#   name:       Full name of the discipline
#   module:     Optional: Associated Ruby module for extended functionality
#   sort_order: [deprecated] Display order in UI (lower numbers first)

disciplines:

  - code: :admin
    label: A
    name: Administration
    prefix_schema: { name: 'default' }
    module: Administration
    sort_order: 10

