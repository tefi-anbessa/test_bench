roles:

  # Global roles (not tied to a specific resource)
  global_roles:
    - admin
    - app_owner
    - document_controller
  # Resource-specific role definitions, split by whether the role applies to
  # one specific resource instance or to every instance of the resource type
  # (resource_type set, resource_id nil). No role is resource_wide-eligible
  # at present - see DEVELOPER_NOTES.md Technical Debt.
  resources:
    project:
      resource_instance:
        - project_manager
        - project_admin
        - team_member
        - document_controller
      resource_wide: []
    discipline:
      resource_instance:
        - designer
        - checker
        - approver
        - controller
        - custodian
        - document_controller
      resource_wide: []
