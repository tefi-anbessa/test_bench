nr: "Not Required"
cable:
  # CableType's own constants - shared across every discipline that builds
  # cable types (see app/models/cable_type.rb), not Electrical-specific.
  constructions:
    core: 1
    pair: 2
    triple: 3
  primary_roles:
    power_distribution: 0
    electrical_control: 1
    analog_signal: 2
    digital_signal: 3
    communication: 4
    thermocouple: 5
    other: 6
  fire_protection:
    standard: 0
    flame_retardant: 1
    low_smoke_zero_halogen: 2
    fire_resistant: 3
  conductor_materials:
    "Cu": 0  # Copper
    "Al": 1  # Aluminium
  conductor_csa:
    - 0.5
    - 0.75
    - 1.0
    - 1.5
    - 2.5
    - 4.0
    - 6.0
    - 10.0
    - 16.0
    - 25.0
    - 35.0
    - 50.0
    - 70.0
    - 95.0
    - 120.0
    - 150.0
    - 185.0
    - 240.0
    - 300.0
    - 400.0
    - 500.0
  insulation_materials:
    "PVC": 0   # Polyvinyl Chloride
    "XLPE": 1  # Cross-linked Polyethylene
    "EPR": 2   # Ethylene Propylene Rubber
    "PUR": 3   # Polyurethane
  armour_materials:
    "SWA": 0    # Steel Wire Armour
    "STA": 1    # Steel Tape Armour
    "AWA": 2    # Aluminium Wire Armour
    "ATA": 3    # Aluminium Tape Armour
    "GSWA": 4   # Galvanized Steel Wire Armour
  voltage_ratings:
    other: 0
    "50/120V": 1  # ELV - extra-low voltage
    "300/500V": 2
    "450/750V": 3
    "600/1000V": 4
    "1.9/3.3kV": 5
    "3.3/6.6kV": 6
    "6.6/11kV": 7
    "11/33kV": 8
    "33/66kV": 9
    "66/132kV": 10
    "132/220kV": 11
  temperature_rating:
    - "60˚C"
    - "75˚C"
    - "90˚C"
tag:
  serial_digits: 4
  separator: "-"
document:
  serial_digits: 5
  separator: "-"
ingress_protection:
  first_digit:
    no_protection: 0
    solid_objects_50mm: 1
    solid_objects_12mm: 2
    solid_objects_2_5mm: 3
    solid_objects_1mm: 4
    dust_protected: 5
    dust_tight: 6
  second_digit:
    no_protection: 0
    dripping_water: 1
    dripping_water_tilted: 2
    spraying_water: 3
    splashing_water: 4
    water_jets: 5
    powerful_water_jets: 6
    temporary_immersion: 7
    continuous_immersion: 8
    high_pressure_water_jets: 9
si_prefix:
  -18: "a"
  -15: "f"
  -12: "p"
  -9: "n"
  -6: "μ"
  -3: "m"
  0: ""
  3: "k"
  6: "M"
  9: "G"
  12: "T"
  15: "P"
  18: "E"