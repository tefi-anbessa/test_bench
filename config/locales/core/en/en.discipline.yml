# Default display names for the standard disciplines (config/constants/
# discipline.yml), keyed by code - the structural identifier, not the
# (project-customizable) name. Custom, project-defined discipline names are
# not translated - the `default:` on each t() call simply shows whatever
# the project named it.
en:
  discipline:
    name:
      E: 'Electrical'
      J: 'Instrument'
      P: 'Process'
      IT: 'Information Technology'
      M: 'Mechanical'
      PIP: 'Piping'
      C: 'Civil'
